name: Verified release preparation (publication requires owner gates)

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Request publication of the selected tag (requires separate owner enablement/approval)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - name: Require the selected tag and exact package version
        env:
          SELECTED_REF: ${{ github.ref }}
          SELECTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$SELECTED_REF" = "refs/tags/$SELECTED_TAG"
          cargo +1.100.0 run --locked -p xtask -- verify-tag "$SELECTED_TAG"

  prepare:
    needs: tag
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  publish:
    if: ${{ github.repository == 'rammses/ipnedir' && needs.prepare.result == 'success' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish == true && vars.IPN_RELEASE_ENABLED == 'true' }}
    needs: [tag, prepare]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      REQUESTED: ${{ inputs.publish }}
      ENABLED: ${{ vars.IPN_RELEASE_ENABLED }}
      CANDIDATE_ID: ${{ needs.prepare.outputs.candidate-id }}
      CANDIDATE_DIGEST: ${{ needs.prepare.outputs.candidate-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - name: Recover the same verified candidate artifact, never trust a filename alone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # BEGIN artifact-validation
          import hashlib, json, os, re, stat, subprocess, threading, zipfile
          from pathlib import Path

          def gh_get(endpoint, limit):
              process = subprocess.Popen(['gh', 'api', '--method', 'GET', '-H', 'X-GitHub-Api-Version: 2026-03-10', endpoint], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              timer = threading.Timer(60, process.kill)
              timer.start()
              try:
                  data = bytearray()
                  while True:
                      chunk = process.stdout.read(min(65536, limit + 1 - len(data)))
                      if not chunk: break
                      data.extend(chunk)
                      if len(data) > limit: raise ValueError('GitHub response exceeds bound')
                  if process.wait(timeout=5) != 0: raise ValueError('GitHub GET failed or timed out; permission/schema errors block')
                  return bytes(data)
              finally:
                  timer.cancel()
                  if process.poll() is None: process.kill()
                  process.wait(timeout=5)
                  process.stdout.close()

          def verify_subject(subject, name):
              def positive(value): return type(value) is int and value > 0
              if not isinstance(subject, dict) or not positive(subject['id']) or subject['name'] != name or subject['expired'] is not False: raise ValueError('invalid artifact identity/state')
              if not positive(subject['size_in_bytes']) or subject['size_in_bytes'] > 140*1024*1024: raise ValueError('artifact size out of bounds')
              digest = subject['digest']
              if not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest): raise ValueError('missing/invalid server artifact digest')
              run = subject['workflow_run']
              for key, expected in [('id', int(os.environ['GITHUB_RUN_ID'])), ('repository_id', int(os.environ['GITHUB_REPOSITORY_ID'])), ('head_repository_id', int(os.environ['GITHUB_REPOSITORY_ID']))]:
                  if not positive(run[key]) or run[key] != expected: raise ValueError('artifact belongs to another run/repository')
              if run['head_sha'] != os.environ['GITHUB_SHA']: raise ValueError('artifact source SHA mismatch')
              return subject['id'], digest.removeprefix('sha256:')

          def extract_zip(path, digest, destination, expected):
              expected = set(expected)
              if not expected or len(expected) > 9 or any(not re.fullmatch(r'[A-Za-z0-9._-]+', name) or '..' in name for name in expected): raise ValueError('unsafe expected filenames')
              limit_for = lambda name: 32*1024*1024 if name.endswith('.tar.gz') else 4096
              bound = sum(limit_for(name) for name in expected) + 1024*1024
              if not path.is_file() or path.is_symlink() or path.stat().st_size > bound: raise ValueError('ZIP exceeds size bound')
              with path.open('rb') as stream:
                  hasher = hashlib.sha256()
                  count = 0
                  while chunk := stream.read(65536):
                      count += len(chunk)
                      if count > bound: raise ValueError('ZIP grew beyond size bound')
                      hasher.update(chunk)
                  actual = hasher.hexdigest()
                  if not re.fullmatch(r'[0-9a-f]{64}', digest) or actual != digest: raise ValueError('ZIP server digest mismatch')
                  stream.seek(0)
                  with zipfile.ZipFile(stream) as archive:
                      entries = archive.infolist()
                      if len(entries) != len(expected) or {e.filename for e in entries} != expected: raise ValueError('missing/duplicate/unexpected ZIP member')
                      payloads = {}
                      for entry in entries:
                          if entry.is_dir() or stat.S_IFMT(entry.external_attr >> 16) not in (0, stat.S_IFREG) or entry.flag_bits & 1: raise ValueError('ZIP member is not a plain regular file')
                          limit = limit_for(entry.filename)
                          if not 0 < entry.file_size <= limit: raise ValueError('ZIP member size out of bounds')
                          with archive.open(entry) as member: data = member.read(limit + 1)
                          if len(data) != entry.file_size or len(data) > limit: raise ValueError('invalid ZIP decompression size')
                          payloads[entry.filename] = data
              for part in [destination, *destination.absolute().parents]:
                  if part.is_symlink(): raise ValueError('symlink destination')
              if any((destination/name).exists() or (destination/name).is_symlink() for name in expected): raise ValueError('candidate overwrite forbidden')
              destination.mkdir(parents=True, exist_ok=True, mode=0o700)
              created = []
              try:
                  for name, data in payloads.items():
                      with (destination/name).open('xb') as output:
                          created.append(destination/name)
                          output.write(data)
              except BaseException:
                  for name in created: name.unlink()
                  raise
          # END artifact-validation
          identifier = os.environ['CANDIDATE_ID']
          if not re.fullmatch(r'[1-9][0-9]*', identifier): raise ValueError('missing candidate artifact id')
          repository = os.environ['GITHUB_REPOSITORY']
          subject = json.loads(gh_get(f'repos/{repository}/actions/artifacts/{identifier}', 1024*1024))
          name = f"verified-candidates-{os.environ['GITHUB_SHA']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          actual_id, digest = verify_subject(subject, name)
          if str(actual_id) != identifier or digest != os.environ['CANDIDATE_DIGEST']: raise ValueError('preparation output/server digest mismatch')
          rows = json.loads(subprocess.check_output(['cargo', '+1.100.0', 'run', '--locked', '-p', 'xtask', '--', 'matrix'], timeout=120))['include']
          expected = {'checksums.txt'}
          for row in rows: expected.update([row['archive'], row['archive'] + '.record'])
          scratch = Path('target/candidate-zips')
          scratch.mkdir(parents=True, exist_ok=False)
          data = gh_get(f'repos/{repository}/actions/artifacts/{identifier}/zip', subject['size_in_bytes'])
          if len(data) != subject['size_in_bytes']: raise ValueError('server artifact size mismatch')
          path = scratch/'verified.zip'
          with path.open('xb') as output: output.write(data)
          extract_zip(path, digest, Path('dist/candidates'), expected)
          print(f"Verified prepared artifact id={identifier} run={os.environ['GITHUB_RUN_ID']} source={os.environ['GITHUB_SHA']} zip_sha256={digest}")
          PY
      - name: Fail closed on actual server protection, then recheck publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/release-control
          gh api --method GET -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/environments/release" > target/release-control/environment.json
          python3 - <<'PY'
          # BEGIN protection-validation
          import os
          def require_protection(data):
              if not isinstance(data, dict) or type(data['id']) is not int or data['id'] <= 0 or data['name'] != 'release': raise ValueError('invalid environment identity')
              expected = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/environments/release"
              if data['url'] != expected: raise ValueError('environment belongs to another source')
              rules = data['protection_rules']
              if not isinstance(rules, list) or any(not isinstance(r, dict) or type(r['id']) is not int or r['id'] <= 0 or not isinstance(r['type'], str) for r in rules): raise ValueError('invalid environment protection schema')
              required = [r for r in rules if r['type'] == 'required_reviewers']
              if len(required) != 1: raise ValueError('owner-configured required reviewers are mandatory; environment name alone is NOT protection')
              rule = required[0]
              if type(rule['prevent_self_review']) is not bool: raise ValueError('invalid reviewer rule schema')
              reviewers = rule['reviewers']
              if not isinstance(reviewers, list) or not 1 <= len(reviewers) <= 6: raise ValueError('required reviewers are empty/invalid')
              for entry in reviewers:
                  if entry['type'] not in ('User', 'Team'): raise ValueError('invalid reviewer kind')
                  reviewer = entry['reviewer']
                  if type(reviewer['id']) is not int or reviewer['id'] <= 0: raise ValueError('invalid reviewer id')
                  identity = reviewer['login'] if entry['type'] == 'User' else reviewer['slug']
                  if not isinstance(identity, str) or not identity: raise ValueError('missing reviewer identity')
              print('Actual server response has required-reviewer protection; owner approval remains a GitHub environment gate')
          # END protection-validation
          import json
          from pathlib import Path
          require_protection(json.loads(Path('target/release-control/environment.json').read_text()))
          PY
          cargo +1.100.0 run --locked -p xtask -- check-publish "$GITHUB_EVENT_NAME" "$REQUESTED" "$ENABLED" "$GITHUB_REF_NAME" dist/candidates
          gh release create "$GITHUB_REF_NAME" dist/candidates/*.tar.gz dist/candidates/checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
