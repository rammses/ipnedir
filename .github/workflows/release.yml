name: Verified release preparation (publication requires owner gates)

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Request publication of the selected tag (requires separate owner enablement/approval)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - name: Require the selected tag and exact package version
        env:
          SELECTED_REF: ${{ github.ref }}
          SELECTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$SELECTED_REF" = "refs/tags/$SELECTED_TAG"
          cargo +1.100.0 run --locked -p xtask -- verify-tag "$SELECTED_TAG"

  prepare:
    needs: tag
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  publish:
    if: ${{ github.repository == 'rammses/ipnedir' && needs.prepare.result == 'success' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && inputs.publish == true && vars.IPN_RELEASE_ENABLED == 'true' }}
    needs: [tag, prepare]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      REQUESTED: ${{ inputs.publish }}
      ENABLED: ${{ vars.IPN_RELEASE_ENABLED }}
      CANDIDATE_ID: ${{ needs.prepare.outputs.candidate-id }}
      CANDIDATE_DIGEST: ${{ needs.prepare.outputs.candidate-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - name: Recover the same verified candidate artifact, never trust a filename alone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from artifacts import gh_get, verify_subject, extract_zip
          identifier = os.environ['CANDIDATE_ID']
          if not re.fullmatch(r'[1-9][0-9]*', identifier): raise ValueError('missing candidate artifact id')
          repository = os.environ['GITHUB_REPOSITORY']
          subject = json.loads(gh_get(f'repos/{repository}/actions/artifacts/{identifier}', 1024*1024))
          name = f"verified-candidates-{os.environ['GITHUB_SHA']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          actual_id, digest = verify_subject(subject, name)
          if str(actual_id) != identifier or digest != os.environ['CANDIDATE_DIGEST']: raise ValueError('preparation output/server digest mismatch')
          rows = json.loads(subprocess.check_output(['cargo', '+1.100.0', 'run', '--locked', '-p', 'xtask', '--', 'matrix'], timeout=120))['include']
          expected = {'checksums.txt'}
          for row in rows: expected.update([row['archive'], row['archive'] + '.record'])
          scratch = Path('target/candidate-zips')
          scratch.mkdir(parents=True, exist_ok=False)
          data = gh_get(f'repos/{repository}/actions/artifacts/{identifier}/zip', subject['size_in_bytes'])
          if len(data) != subject['size_in_bytes']: raise ValueError('server artifact size mismatch')
          path = scratch/'verified.zip'
          with path.open('xb') as output: output.write(data)
          extract_zip(path, digest, Path('dist/candidates'), expected)
          print(f"Verified prepared artifact id={identifier} run={os.environ['GITHUB_RUN_ID']} source={os.environ['GITHUB_SHA']} zip_sha256={digest}")
          PY
      - name: Fail closed on actual server protection, then recheck publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/release-control
          gh api --method GET -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/environments/release" > target/release-control/environment.json
          python3 -B - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          from artifacts import require_protection
          require_protection(json.loads(Path('target/release-control/environment.json').read_text()))
          PY
          cargo +1.100.0 run --locked -p xtask -- check-publish "$GITHUB_EVENT_NAME" "$REQUESTED" "$ENABLED" "$GITHUB_REF_NAME" dist/candidates
          gh release create "$GITHUB_REF_NAME" dist/candidates/*.tar.gz dist/candidates/checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
